spring.application.name=backend

spring.ai.model.chat=google-genai
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.model=gemini-3.6-flash

spring.datasource.url=jdbc:postgresql://localhost:5432/codelens_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=8080
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000
codelens.quality-gate.threshold=70
github.app.id=${GITHUB_APP_ID}
github.webhook.secret=${GITHUB_WEBHOOK_SECRET}
github.app.private-key-path=github-app-private-key.pem
github.system-user-email=github-bot@codelensai.local